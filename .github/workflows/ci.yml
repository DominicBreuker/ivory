name: ci

# Runs on every push to main and on demand (Actions → ci → Run workflow).
# Pull requests and other branches get no automatic run: check them
# locally before merging. Pushes that change only Markdown or docs/ are
# skipped. The Windows SChannel jobs run on demand only.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: gofmt
        run: |
          mapfile -t files < <(git ls-files '*.go')
          out=$(gofmt -l "${files[@]}")
          if [ -n "$out" ]; then echo "not gofmt-ed:"; echo "$out"; exit 1; fi
      - name: go vet (stock)
        run: go vet ./...
      - name: go vet (overlay, -tags=ivory)
        run: |
          ivory-overlay build -profile core
          eval "$(ivory-overlay env -profile core)"
          go vet ./...
      - name: go vet and go test cmd/ivory-overlay (pinned Go)
        run: |
          go -C cmd/ivory-overlay vet ./...
          go -C cmd/ivory-overlay test -count=1 -v ./...
      - name: shellcheck
        run: shellcheck -S warning scripts/ivory-overlay scripts/*.sh

  # cmd/ivory-overlay is a module of its own so that an older Go can build it
  # and bootstrap the pinned release; check the oldest Go it supports.
  tool:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
          cache: false
      - name: build, vet and test cmd/ivory-overlay with Go 1.22
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go -C cmd/ivory-overlay vet ./...
          go -C cmd/ivory-overlay test -count=1 ./...
          go -C cmd/ivory-overlay build -o "$RUNNER_TEMP/ivory-overlay" .
          "$RUNNER_TEMP/ivory-overlay" latest

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: go test (stock)
        run: go test -count=1 -v ./...

  overlay:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: build overlay
        run: |
          ivory-overlay build -profile ${{ matrix.profile }}
          ivory-overlay doctor -profile ${{ matrix.profile }}
      - name: go test -short crypto/x509 crypto/tls (overlay)
        run: ivory-overlay stdtest -profile ${{ matrix.profile }}
      # Go's builders run the crypto tests in FIPS 140-3 mode too; the
      # hooks are off there and their tests must skip.
      - name: go test -short crypto/x509 crypto/tls in FIPS 140-3 mode (overlay)
        run: GOFIPS140=latest ivory-overlay stdtest -profile ${{ matrix.profile }}
      - name: go vet crypto/x509 crypto/tls for windows and darwin (overlay)
        run: |
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          cd "$GOROOT/src"
          for os in windows darwin; do GOOS=$os go vet crypto/x509 crypto/tls; done
      - name: go test (overlay, -tags=ivory)
        run: |
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          go test -count=1 -v ./...
      - name: ti.Verifier and tsl against the TI test PKI (GemLibPki certificates and TSLs)
        run: |
          scripts/fetch-gemlibpki.sh "$RUNNER_TEMP/gemlibpki"
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          IVORY_GEMLIBPKI="$RUNNER_TEMP/gemlibpki" IVORY_REQUIRE_GEMLIBPKI=1 go test -count=1 -v -run TestGemLibPki ./ti ./tsl
      - name: tsl against archived production, reference and test TSLs (corpus)
        run: |
          scripts/fetch-tsl-corpus.sh "$RUNNER_TEMP/tsl-corpus"
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          IVORY_TSL_CORPUS="$RUNNER_TEMP/tsl-corpus" IVORY_REQUIRE_TSL_CORPUS=1 go test -count=1 -v -run TestTSLCorpus ./tsl
      - name: BoGo Renegotiate-* (materialized GOROOT)
        run: ivory-overlay bogo -profile ${{ matrix.profile }} -filter 'Renegotiate-*'

  # TLS 1.3 with Brainpool groups and signature schemes (RFC 8734) against
  # OpenSSL >= 3.2; the runner's OpenSSL 3.0.13 has them only in TLS 1.2.
  tls13:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    env:
      OPENSSL_VERSION: 3.5.4
      OPENSSL_SHA256: 967311f84955316969bdb1d8d4b983718ef42338639c621ec4c34fddef355e99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ivory/openssl-${{ env.OPENSSL_VERSION }}
          key: openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: build OpenSSL from source
        run: scripts/build-openssl.sh "$OPENSSL_VERSION" "$OPENSSL_SHA256" "$HOME/.cache/ivory/openssl-$OPENSSL_VERSION"
      - name: build overlay
        run: ivory-overlay build -profile ${{ matrix.profile }}
      - name: TLS 1.3 tests (I13-I17, tlsutil)
        run: |
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          export IVORY_OPENSSL3="$HOME/.cache/ivory/openssl-$OPENSSL_VERSION/bin/openssl" IVORY_REQUIRE_TLS13=1
          "$IVORY_OPENSSL3" version
          go test -count=1 -v -run 'TestI1[3-7]' ./interop
          go test -count=1 -v ./tlsutil

  # tlsfuzzer's Brainpool scripts and the ECDSA scripts with Brainpool
  # identities against ivory servers (interop/tlsfuzzer_test.go).
  tlsfuzzer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: fetch tlsfuzzer
        run: scripts/fetch-tlsfuzzer.sh "$RUNNER_TEMP/tlsfuzzer"
      - name: build overlay
        run: ivory-overlay build -profile ${{ matrix.profile }}
      - name: tlsfuzzer (F1-F6)
        run: |
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          export IVORY_TLSFUZZER="$RUNNER_TEMP/tlsfuzzer" IVORY_REQUIRE_TLSFUZZER=1
          go test -count=1 -v -run 'TestF[1-6]' ./interop

  # Windows SChannel through .NET's SslStream (S1-S7,
  # interop/testdata/schannel): the Go peer is cross-compiled here with
  # the overlay, the Windows job runs it.
  # On demand only: Windows runners cost more than Linux ones.
  schannel-peer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: build overlay
        run: ivory-overlay build -profile ${{ matrix.profile }}
      - name: build the Go peer for Windows
        run: |
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/gopeer/gopeer.exe" ./interop/testdata/schannel/gopeer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gopeer-${{ matrix.profile }}
          path: ${{ runner.temp }}/gopeer/gopeer.exe
          retention-days: 1

  schannel:
    needs: schannel-peer
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gopeer-${{ matrix.profile }}
          path: ${{ runner.temp }}/gopeer
      - name: enable the Brainpool groups in SChannel (off by default)
        shell: pwsh
        run: interop/testdata/schannel/enable-brainpool.ps1
      - name: build the .NET peer
        shell: pwsh
        run: |
          dotnet --list-sdks
          dotnet build interop/testdata/schannel/SChannelPeer -c Release -o "$env:RUNNER_TEMP/scpeer"
      - name: SChannel interop (S1-S7)
        shell: pwsh
        run: >
          interop/testdata/schannel/run.ps1
          -GoPeer "$env:RUNNER_TEMP/gopeer/gopeer.exe"
          -NetPeer "$env:RUNNER_TEMP/scpeer/SChannelPeer.exe"
          -Pki testdata/pki

  # Interop with BouncyCastle's TLS provider for Java (BCJSSE), TLS 1.2 and
  # TLS 1.3, both roles (interop/bc_test.go).
  bc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ivory/bouncycastle
          key: bouncycastle-${{ hashFiles('scripts/fetch-bouncycastle.sh') }}
      - name: fetch BouncyCastle
        run: scripts/fetch-bouncycastle.sh "$HOME/.cache/ivory/bouncycastle"
      - name: build overlay
        run: ivory-overlay build -profile ${{ matrix.profile }}
      - name: BouncyCastle interop (B1-B8)
        run: |
          eval "$(ivory-overlay env -profile ${{ matrix.profile }})"
          java -version
          export IVORY_BCJARS="$HOME/.cache/ivory/bouncycastle" IVORY_REQUIRE_BC=1
          go test -count=1 -v -run 'TestB[1-9]' ./interop
