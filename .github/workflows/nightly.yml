name: nightly

# The long checks. Scheduled runs do their work only in a public
# repository, where runner minutes are free; elsewhere, start the
# workflow by hand (Actions → nightly → Run workflow).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bogo:
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [core, kt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: full BoGo (materialized GOROOT)
        run: ivory-overlay bogo -profile ${{ matrix.profile }}

  x509-long:
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: go test crypto/x509, non-short (x509-limbo, PKITS)
        run: |
          ivory-overlay build -profile core
          eval "$(ivory-overlay env -profile core)"
          cd "$GOROOT/src"
          go test -count=1 crypto/x509

  # Applies the upstream patches P0-P5 to Go's development branch, adapts
  # them with overlay/tip-rewrites.txt, builds it and runs the crypto/x509
  # and crypto/tls tests there. A failure means the development branch
  # changed in a way the patches or the rewrites don't follow yet.
  tipcheck:
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: tipcheck (golang/go master)
        run: ivory-overlay tipcheck -profile core
      - name: tipcheck -test (build tip, go test crypto/x509 crypto/tls)
        run: ivory-overlay tipcheck -profile core -test

  # Verifies today's TSL of the TI's production, reference and test
  # environments against its pinned trust anchor (GEM.TSL-CA3 and
  # GEM.TSL-CA28 TEST-ONLY, brainpoolP256r1). A failure means the TSL
  # service changed something: a new anchor (update the pin in
  # scripts/fetch-production-tsl.sh after checking its fingerprint), a
  # format ivory doesn't read, or an outage.
  production-tsl:
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [prod, ref, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ivory
      - name: verify the ${{ matrix.env }} TSL
        run: |
          scripts/fetch-production-tsl.sh "$RUNNER_TEMP/production-tsl" ${{ matrix.env }}
          ivory-overlay build -profile core
          eval "$(ivory-overlay env -profile core)"
          IVORY_PRODUCTION_TSL="$RUNNER_TEMP/production-tsl" IVORY_REQUIRE_PRODUCTION_TSL=1 go test -count=1 -v -run TestProductionTSL ./tsl
